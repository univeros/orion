# The services the conformance suites run against locally; CI starts the same images.
#   docker compose up -d && export $(grep -v '^#' .env.testing | xargs) && composer qa
services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: orion, POSTGRES_PASSWORD: orion, POSTGRES_DB: orion }
    ports: ['54329:5432']
  mysql:
    image: mysql:8.4
    environment: { MYSQL_ROOT_PASSWORD: orion, MYSQL_DATABASE: orion }
    ports: ['33069:3306']
  elasticsearch:
    image: elasticsearch:9.5.5
    environment: { discovery.type: single-node, xpack.security.enabled: 'false', ES_JAVA_OPTS: -Xms512m -Xmx512m }
    ports: ['59200:9200']
  elasticsearch8:
    image: elasticsearch:8.19.23
    environment: { discovery.type: single-node, xpack.security.enabled: 'false', ES_JAVA_OPTS: -Xms512m -Xmx512m }
    ports: ['59201:9200']
  solr:
    image: solr:10.0.0
    environment: { SOLR_MODE: solrcloud, SOLR_HEAP: 512m }
    ports: ['58983:8983']
  solr9:
    image: solr:9.11.0
    environment: { SOLR_MODE: solrcloud, SOLR_HEAP: 512m }
    ports: ['58984:8983']
